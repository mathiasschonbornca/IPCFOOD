name: Expand IPC FOOD production package

on:
  push:
    branches:
      - main
    paths:
      - "_deployment/ipcfood-package/**"
      - ".github/workflows/expand-ipcfood.yml"

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, 'chore: publish ipc food production files') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and expand production package
        shell: bash
        run: |
          set -euo pipefail
          cat _deployment/ipcfood-package/part*.txt > /tmp/ipcfood.b64
          base64 -d /tmp/ipcfood.b64 > /tmp/ipcfood.zip
          rm -rf data docs services scripts scraping
          rm -f index.html app.js styles.css README.md package.json vercel.json .gitignore
          unzip -o /tmp/ipcfood.zip -d .
          rm -rf _deployment
          rm -f .github/workflows/expand-ipcfood.yml

      - name: Commit expanded production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: publish ipc food production files"
            git push
          fi
